[package]
name = "z-synthora-compliance"
version = "0.1.0"
edition = "2021"
description = "Enterprise counterparty due-diligence TEE contract for T3N — sanctions/AML screening + PII-safe deep-audit requests + Merkle-anchored compliance briefs"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
